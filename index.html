<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Інтернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #12121a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px;">
    <header style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
        <h1 style="margin: 0; color: #4f46e5;">TechStore</h1>
        
        <!-- Пошук та категорії -->
        <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
            <input type="text" id="search-input" placeholder="Пошук товарів..." style="padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1e1e2f; color: #fff; flex: 1; min-width: 200px; outline: none;">
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="category-btn active" data-category="all" style="padding: 8px 15px; border-radius: 6px; border: none; background: #4f46e5; color: white; cursor: pointer;">Всі</button>
                <button class="category-btn" data-category="laptops" style="padding: 8px 15px; border-radius: 6px; border: none; background: #334155; color: white; cursor: pointer;">Ноутбуки</button>
                <button class="category-btn" data-category="phones" style="padding: 8px 15px; border-radius: 6px; border: none; background: #334155; color: white; cursor: pointer;">Смартфони</button>
                <button class="category-btn" data-category="accessories" style="padding: 8px 15px; border-radius: 6px; border: none; background: #334155; color: white; cursor: pointer;">Аксесуари</button>
            </div>
        </div>

        <div id="product-count" style="color: #94a3b8; font-size: 14px;"></div>
    </header>

    <!-- Контейнер для карток товарів -->
    <main style="max-width: 1200px; margin: 20px auto 0;">
        <div id="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;"></div>
    </main>

    <!-- Підключення скрипта -->
    <script src="script.js"></script>
</body>
</html>
