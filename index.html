<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore</title>
  <!-- Иконки FontAwesome для сердечек и корзины -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background: #12121a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px;">

  <!-- Шапка -->
  <header style="max-width: 1200px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid #2a2a3c; padding-bottom: 20px;">
    <h1 style="margin: 0; color: #38bdf8; font-size: 28px;">TechStore</h1>

    <!-- Поиск -->
    <div style="flex: 1; max-width: 400px; position: relative;">
      <input type="text" id="searchInput" placeholder="Пошук товарів..." style="width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; background: #1e1e2f; color: #fff; outline: none; box-sizing: border-box;">
    </div>

    <!-- Кнопки избранного и корзины -->
    <div style="display: flex; gap: 15px;">
      <div style="background: #1e1e2f; padding: 8px 15px; border-radius: 8px; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-heart" style="color: #ef4444;"></i>
        <span id="favCount">0</span>
      </div>
      <button id="cartBtn" style="background: #38bdf8; color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Кошик</span> (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- Основной контент -->
  <div style="max-width: 1200px; margin: 0 auto; display: flex; gap: 30px; flex-wrap: wrap;">
    
    <!-- Боковая панель фильтров -->
    <aside style="width: 250px; background: #1e1e2f; padding: 20px; border-radius: 12px; height: fit-content; box-sizing: border-box;">
      <h3 style="margin-top: 0; color: #38bdf8; font-size: 18px;">Категорії</h3>
      <ul id="categoryFilter" style="list-style: none; padding: 0; margin: 0 0 25px 0;">
        <li data-cat="all" class="active" style="padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; background: #38bdf8; color: #000; font-weight: bold;">Всі товари</li>
        <li data-cat="phones" style="padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; color: #cbd5e1;">Смартфони</li>
        <li data-cat="laptops" style="padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; color: #cbd5e1;">Ноутбуки / ПК</li>
        <li data-cat="gaming" style="padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; color: #cbd5e1;">Геймінг</li>
        <li data-cat="smarthome" style="padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; color: #cbd5e1;">Розумний Дім</li>
        <li data-cat="audio" style="padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; color: #cbd5e1;">Аудіо</li>
      </ul>

      <h3 style="color: #38bdf8; font-size: 18px; margin-bottom: 10px;">Макс. ціна</h3>
      <div>
        <input type="range" id="priceRange" min="1000" max="80000" step="1000" value="80000" style="width: 100%; accent-color: #38bdf8; cursor: pointer;">
        <div id="priceValue" style="text-align: right; margin-top: 5px; font-weight: bold; color: #38bdf8;">80 000 грн</div>
      </div>
    </aside>

    <!-- Сетка товаров -->
    <main style="flex: 1; min-width: 300px;">
      <div id="productCount" style="margin-bottom: 15px; color: #94a3b8; font-size: 14px;"></div>
      <div id="productsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;"></div>
    </main>

  </div>

  <!-- Модальное окно корзины -->
  <div id="cartModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: #1e1e2f; width: 90%; max-width: 500px; border-radius: 12px; padding: 25px; box-sizing: border-box; position: relative;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #38bdf8;">Ваш кошик</h2>
        <button id="closeCart" style="background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer;">&times;</button>
      </div>

      <!-- Контейнер для списков товаров в корзине -->
      <div id="cartItems" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; padding-top: 15px;">
        <span style="font-size: 18px;">Разом:</span>
        <span id="cartTotalPrice" style="font-size: 20px; font-weight: bold; color: #38bdf8;">0 грн</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
