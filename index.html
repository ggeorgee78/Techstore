<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore — Інтернет-магазин електроніки</title>
  <!-- Подключаем иконки FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="container header-container">
      <a href="#" class="logo">
        <i class="fa-solid fa-microchip"></i> Tech<span>Store</span>
      </a>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Пошук товарів (наприклад, iPhone, RTX)...">
      </div>

      <div class="header-actions">
        <!-- Переключатель валют -->
        <select id="currencySelect" class="currency-select" title="Оберіть валюту">
          <option value="UAH">UAH (₴)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>

        <!-- Кнопка Избранного -->
        <button id="favBtn" class="action-btn" title="Обрані товари">
          <i class="fa-solid fa-heart"></i>
          <span id="favCount" class="badge">0</span>
        </button>

        <!-- Кнопка Корзины -->
        <button id="cartBtn" class="action-btn" title="Кошик">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cartCount" class="badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="container main-layout">
    <!-- Боковая панель фильтров -->
    <aside class="sidebar">
      <div class="filter-block">
        <h3>Категорії</h3>
        <ul id="categoryFilter" class="category-list">
          <li data-cat="all" class="active"><i class="fa-solid fa-border-all"></i> Всі товари</li>
          <li data-cat="phones"><i class="fa-solid fa-mobile-screen"></i> Смартфони</li>
          <li data-cat="laptops"><i class="fa-solid fa-laptop"></i> Ноутбуки та ПК</li>
          <li data-cat="gaming"><i class="fa-solid fa-gamepad"></i> Геймінг</li>
          <li data-cat="smarthome"><i class="fa-solid fa-house-signal"></i> Розумний дім</li>
          <li data-cat="audio"><i class="fa-solid fa-headphones"></i> Аудіо</li>
        </ul>
      </div>

      <div class="filter-block">
        <h3>Максимальна ціна</h3>
        <div class="price-slider-container">
          <input type="range" id="priceRange" min="5000" max="150000" step="1000" value="150000">
          <div class="price-display">
            До: <span id="priceValue">150 000 грн</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Секция с товарами -->
    <section class="catalog">
      <div class="catalog-header">
        <h2>Каталог товарів</h2>
        <span id="productCount" class="product-count">Показано 8 товарів</span>
      </div>

      <!-- Сюда JS рендерит карточки -->
      <div id="productsGrid" class="products-grid"></div>
    </section>
  </main>

  <!-- Модальное окно Корзины -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fa-solid fa-cart-shopping"></i> Ваш кошик</h2>
        <button id="closeCart" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="cartItems" class="modal-body">
        <!-- Сюда JS рендерит товары в корзине -->
      </div>

      <div class="modal-footer">
        <div class="total-row">
          <span>Разом до сплати:</span>
          <span id="cartTotalPrice" class="total-price">0 грн</span>
        </div>
        <!-- Кнопка оформления заказа (также поддерживается вашим JS) -->
        <button id="checkoutBtn" class="checkout-btn">Оформити замовлення</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Избранного -->
  <div id="favModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fa-solid fa-heart" style="color: #ef4444;"></i> Обрані товари</h2>
        <button id="closeFav" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="favItemsContainer" class="modal-body">
        <!-- Сюда JS рендерит лайкнутые товары -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
